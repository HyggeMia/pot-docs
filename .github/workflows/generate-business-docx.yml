name: Generate business deviation Word

on:
  push:
    paths:
      - 'tmp/generate_business_docx.py'
      - '.github/workflows/generate-business-docx.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install python-docx
      - run: python tmp/generate_business_docx.py
      - name: Commit generated Word file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/business_deviation_table_refined.docx
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Generate refined business deviation Word file [skip ci]"
            git push
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: business-deviation-word
          path: artifacts/business_deviation_table_refined.docx
